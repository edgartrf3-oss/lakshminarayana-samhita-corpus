name: Build LNS corpus snapshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-corpus.yml"
      - "lns_corpus/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lns-corpus-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Download revision-pinned Wikisource snapshot
        env:
          LNS_USER_AGENT: "LakshminarayanaSamhitaCorpusBot/0.3 (${{ github.server_url }}/${{ github.repository }}; research corpus)"
        run: python scripts/download.py --user-agent "$LNS_USER_AGENT" --delay 0.5
      - name: Build normalized and transliterated corpus
        run: python scripts/build.py
      - name: Validate corpus
        run: python scripts/validate.py
      - name: Create consolidated text files
        run: python scripts/consolidate.py
      - name: Build HTML corpus and navigable site
        run: python scripts/build_html.py
      - name: Record provenance
        run: |
          mkdir -p metadata
          printf 'repository=%s\ncommit=%s\nrun_id=%s\ngenerated_at=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > metadata/github-actions-run.txt
      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lns-wikisource-snapshot-${{ github.sha }}
          path: source/wikisource/
          retention-days: 90
      - name: Upload searchable corpus
        uses: actions/upload-artifact@v4
        with:
          name: lns-searchable-corpus-${{ github.sha }}
          path: |
            corpus/
            consolidated/
            metadata/
            reports/
            site/
          retention-days: 90
      - name: Publish generated site to gh-pages branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/lns-pages
          mkdir -p /tmp/lns-pages
          cp -a site/. /tmp/lns-pages/
          cd /tmp/lns-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish LNS web corpus from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
